<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hirance test — Round details</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <h1>Round details</h1>
        <p>Full round payload: timing, summary, leaderboard, participant scores, and stored webhook elapsed times.</p>
      </div>
    </header>

    <nav id="nav" class="tabs"></nav>

    <section class="keys">
      <div>
        <label for="adminKey">Admin API key</label>
        <input id="adminKey" type="password" autocomplete="off" />
      </div>
      <div>
        <label for="webhookSecret">Webhook secret</label>
        <input id="webhookSecret" type="password" autocomplete="off" />
      </div>
      <div>
        <label for="roundId">Round</label>
        <select id="roundId" data-round-id></select>
      </div>
      <div class="actions" style="align-items: end;">
        <button class="ghost" id="loadActive" type="button">Active round</button>
        <button class="primary" id="loadDetails" type="button">Load details</button>
      </div>
    </section>

    <section class="card">
      <h2>Summary</h2>
      <p class="empty" id="summary">Load a round to see details.</p>
    </section>

    <section class="card" style="margin-top: 16px;">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </section>

    <section class="card" style="margin-top: 16px;">
      <h2>Participant scores</h2>
      <div id="scores"></div>
    </section>

    <section class="log">
      <h2 id="logTitle">API log</h2>
      <pre id="logBody">GET /admin/rounds/:id/details, /leaderboard, /active</pre>
    </section>
  </div>

  <script src="./app.js"></script>
  <script>
    const T = window.HiranceTest;
    T.renderNav('details.html');
    T.loadKeys();

    function renderDetails(details) {
      T.setRoundId(details.id);
      T.$('summary').innerHTML = `
        ${T.badge(details.status)} <strong>${details.name}</strong><br>
        Limit ${details.timeLimitSeconds}s · elapsed ${T.formatMs(details.elapsedMs)} · remaining ${T.formatMs(details.remainingMs)} · expired ${details.expired ? 'yes' : 'no'}<br>
        People ${details.summary?.participantCount ?? 0} · events ${details.summary?.eventCount ?? 0} · points ${details.summary?.totalPoints ?? 0}
      `;

      const board = details.leaderboard || [];
      T.$('leaderboard').innerHTML = board.length
        ? `<table>
            <thead><tr><th>Rank</th><th>Name</th><th>Company</th><th>Points</th><th>Last elapsed</th><th>Jobs</th></tr></thead>
            <tbody>${board.map((row) => `
              <tr>
                <td>${row.rank}</td>
                <td>${row.name}</td>
                <td>${row.companyId}</td>
                <td>${row.totalPoints}</td>
                <td>${T.formatMs(row.lastElapsedMs)}</td>
                <td>${row.jobCount}</td>
              </tr>`).join('')}</tbody>
          </table>`
        : '<p class="empty">No scored participants yet.</p>';

      const people = details.participants || [];
      T.$('scores').innerHTML = people.length
        ? people.map((person) => `
            <h3 style="margin: 12px 0 6px;">#${person.id} ${person.name} (${person.totalPoints} pts)</h3>
            ${person.scores?.length
              ? `<table>
                  <thead><tr><th>Job</th><th>Status</th><th>Points</th><th>Elapsed</th></tr></thead>
                  <tbody>${person.scores.map((score) => `
                    <tr>
                      <td>${score.jobName || score.jobId || '—'}</td>
                      <td>${T.badge(score.status)}</td>
                      <td>${score.points}</td>
                      <td>${T.formatMs(score.elapsedMs)} ${score.elapsedMs != null ? `(${score.elapsedMs} ms)` : ''}</td>
                    </tr>`).join('')}</tbody>
                </table>`
              : '<p class="empty">No scores yet.</p>'}
          `).join('')
        : '<p class="empty">No participants in this round.</p>';
    }

    async function loadDetails() {
      await T.loadRoundsInto('roundId');
      const details = await T.adminGet(`/admin/rounds/${T.currentRoundId()}/details`);
      renderDetails(details);
    }

    T.$('roundId').addEventListener('change', (event) => {
      T.setRoundId(event.target.value);
      loadDetails().catch((error) => T.showLog('Error', error.message));
    });
    T.$('loadDetails').addEventListener('click', () => loadDetails().catch((error) => T.showLog('Error', error.message)));
    T.$('loadActive').addEventListener('click', async () => {
      const details = await T.adminGet('/admin/rounds/active');
      await T.loadRoundsInto('roundId');
      renderDetails(details);
    });

    T.loadRoundsInto('roundId')
      .then(() => loadDetails())
      .catch((error) => T.showLog('Error', error.message));
  </script>
</body>
</html>
