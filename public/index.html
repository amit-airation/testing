<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hirance test — Rounds</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <h1>Dummy test console</h1>
        <p>Use these screens to exercise admin APIs, round timing, and job webhooks.</p>
      </div>
    </header>

    <nav id="nav" class="tabs"></nav>

    <section class="keys">
      <div>
        <label for="adminKey">Admin API key</label>
        <input id="adminKey" type="password" autocomplete="off" placeholder="ADMIN_API_KEY" />
      </div>
      <div>
        <label for="webhookSecret">Webhook secret</label>
        <input id="webhookSecret" type="password" autocomplete="off" placeholder="WEBHOOK_SECRET" />
      </div>
      <div>
        <label for="roundId">Selected round</label>
        <select id="roundId" data-round-id></select>
      </div>
      <div class="actions" style="align-items: end;">
        <button class="ghost" id="saveKeys" type="button">Save keys</button>
        <button class="primary" id="refreshRounds" type="button">Refresh rounds</button>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Create round</h2>
        <div class="row">
          <div>
            <label for="roundName">Name</label>
            <input id="roundName" value="Round 1" />
          </div>
          <div>
            <label for="timeLimitSeconds">Time limit (seconds)</label>
            <input id="timeLimitSeconds" type="number" min="1" value="300" />
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <div>
            <label for="roundStatus">Status</label>
            <select id="roundStatus">
              <option value="draft" selected>draft</option>
              <option value="active">active (starts immediately)</option>
              <option value="closed">closed</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="createRound" type="button">Create round</button>
        </div>
      </section>

      <section class="card">
        <h2>Start / stop / update</h2>
        <div class="row">
          <div>
            <label for="updateName">New name</label>
            <input id="updateName" placeholder="optional" />
          </div>
          <div>
            <label for="updateLimit">New time limit (seconds)</label>
            <input id="updateLimit" type="number" min="1" placeholder="optional" />
          </div>
        </div>
        <div class="actions">
          <button class="ok" id="startRound" type="button">Start</button>
          <button class="danger" id="stopRound" type="button">Stop</button>
          <button class="ghost" id="updateRound" type="button">Update</button>
          <button class="ghost" id="loadRound" type="button">Load details</button>
        </div>
        <p class="empty" id="roundSummary">Select a round to see remaining time.</p>
      </section>
    </div>

    <section class="card" style="margin-top: 16px;">
      <h2>Rounds</h2>
      <div id="roundsTable"></div>
    </section>

    <section class="log">
      <h2 id="logTitle">API log</h2>
      <pre id="logBody">Save your keys, then create or start a round.</pre>
    </section>
  </div>

  <script src="./app.js"></script>
  <script>
    const T = window.HiranceTest;
    T.renderNav('index.html');
    T.loadKeys();

    async function refresh() {
      const rounds = await T.loadRoundsInto('roundId');
      const rows = rounds.map((round) => `
        <tr class="${String(round.id) === String(T.currentRoundId()) ? 'selected' : ''}">
          <td>#${round.id}</td>
          <td>${round.name}</td>
          <td>${T.badge(round.status)}</td>
          <td>${round.timeLimitSeconds}s</td>
          <td>${T.formatMs(round.elapsedMs)}</td>
          <td>${T.formatMs(round.remainingMs)}</td>
          <td>${round.expired ? 'yes' : 'no'}</td>
          <td>${round._count?.participants ?? 0}</td>
          <td><button class="ghost" data-pick="${round.id}" type="button">Select</button></td>
        </tr>
      `).join('');
      T.$('roundsTable').innerHTML = rounds.length
        ? `<table>
            <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Limit</th><th>Elapsed</th><th>Remaining</th><th>Expired</th><th>People</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`
        : '<p class="empty">No rounds yet.</p>';
      updateSummary(rounds);
    }

    function updateSummary(rounds) {
      const round = rounds.find((item) => String(item.id) === String(T.currentRoundId()));
      if (!round) {
        T.$('roundSummary').textContent = 'Select a round to see remaining time.';
        return;
      }
      T.$('roundSummary').innerHTML =
        `${T.badge(round.status)} <strong>${round.name}</strong> — elapsed ${T.formatMs(round.elapsedMs)}, remaining ${T.formatMs(round.remainingMs)}`;
    }

    T.$('roundId').addEventListener('change', (event) => {
      T.setRoundId(event.target.value);
      refresh().catch((error) => T.showLog('Error', error.message));
    });
    T.$('saveKeys').addEventListener('click', () => {
      T.saveKeys();
      T.showLog('Keys saved', { ok: true });
    });
    T.$('refreshRounds').addEventListener('click', () => refresh().catch((error) => T.showLog('Error', error.message)));
    T.$('createRound').addEventListener('click', async () => {
      const round = await T.adminSend('POST', '/admin/rounds', {
        name: T.$('roundName').value,
        timeLimitSeconds: Number(T.$('timeLimitSeconds').value),
        status: T.$('roundStatus').value,
      });
      T.setRoundId(round.id);
      await refresh();
    });
    T.$('startRound').addEventListener('click', async () => {
      await T.adminSend('POST', `/admin/rounds/${T.currentRoundId()}/start`);
      await refresh();
    });
    T.$('stopRound').addEventListener('click', async () => {
      await T.adminSend('POST', `/admin/rounds/${T.currentRoundId()}/stop`);
      await refresh();
    });
    T.$('updateRound').addEventListener('click', async () => {
      const body = {};
      if (T.$('updateName').value.trim()) body.name = T.$('updateName').value.trim();
      if (T.$('updateLimit').value) body.timeLimitSeconds = Number(T.$('updateLimit').value);
      await T.adminSend('PATCH', `/admin/rounds/${T.currentRoundId()}`, body);
      await refresh();
    });
    T.$('loadRound').addEventListener('click', async () => {
      await T.adminGet(`/admin/rounds/${T.currentRoundId()}`);
    });
    T.$('roundsTable').addEventListener('click', (event) => {
      const id = event.target?.dataset?.pick;
      if (!id) return;
      T.setRoundId(id);
      refresh().catch((error) => T.showLog('Error', error.message));
    });

    refresh().catch((error) => T.showLog('Error', error.message));
    setInterval(() => {
      refresh().catch(() => {});
    }, 5000);
  </script>
</body>
</html>
