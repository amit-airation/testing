services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirance
      POSTGRES_PASSWORD: hirance
      POSTGRES_DB: hirance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirance -d hirance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://hirance:hirance@db:5432/hirance
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
